name: Build PortalApp APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup PortalApp Light & Stable Source
      run: |
        rm -rf app settings.gradle build.gradle gradle.properties

        # 1. Konfigurasi gradle.properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        EOF

        # 2. Konfigurasi settings.gradle
        echo "rootProject.name = 'PortalApp'" > settings.gradle
        echo "include ':app'" >> settings.gradle

        # 3. Konfigurasi build.gradle (Root)
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # Struktur Folder
        mkdir -p app/src/main/java/com/portalapp/games
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/mipmap-anydpi-v26
        mkdir -p app/src/main/res/drawable

        # 4. Konfigurasi app/build.gradle (Super Ringan)
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.portalapp.games'
            compileSdk 34
            defaultConfig {
                applicationId "com.portalapp.games"
                minSdk 21
                targetSdk 34
                versionCode 3
                versionName "3.0"
            }
            buildTypes {
                release {
                    minifyEnabled true
                    shrinkResources true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 5. Desain Ikon kustom PortalApp (Bukan ikon polos default)
        cat << 'EOF' > app/src/main/res/drawable/ic_portal_logo.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp"
            android:height="108dp"
            android:viewportWidth="108"
            android:viewportHeight="108">
            <path
                android:fillColor="#0D1117"
                android:pathData="0,0h108v108h-108z"/>
            <path
                android:fillColor="#238636"
                android:pathData="M54,20 A34,34 0 1,0 88,54 A34,34 0 0,0 54,20 Z M54,76 A22,22 0 1,1 76,54 A22,22 0 0,1 54,76 Z"/>
            <path
                android:fillColor="#58A6FF"
                android:pathData="M54,38 A16,16 0 1,0 70,54 A16,16 0 0,0 54,38 Z"/>
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_portal_logo"/>
            <foreground android:drawable="@drawable/ic_portal_logo"/>
        </adaptive-icon>
        EOF

        # 6. AndroidManifest.xml dengan optimasi performa & Hardware Acceleration
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

            <application
                android:label="PortalApp"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher"
                android:usesCleartextTraffic="true"
                android:hardwareAccelerated="true"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name="com.portalapp.games.MainActivity"
                    android:exported="true"
                    android:configChanges="orientation|screenSize|keyboardHidden">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        echo '<resources><string name="app_name">PortalApp</string></resources>' > app/src/main/res/values/strings.xml

        # 7. Layout Ringan (activity_main.xml)
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#0D1117">

            <LinearLayout
                android:id="@+id/topBar"
                android:layout_width="match_parent"
                android:layout_height="54dp"
                android:background="#161B22"
                android:orientation="horizontal"
                android:gravity="center_vertical"
                android:paddingHorizontal="16dp">

                <ToggleButton
                    android:id="@+id/btnTogglePower"
                    android:layout_width="76dp"
                    android:layout_height="36dp"
                    android:textOn="ON"
                    android:textOff="OFF"
                    android:checked="false"
                    android:textColor="#FFFFFF"
                    android:textSize="12sp"
                    android:textStyle="bold"
                    android:backgroundTint="#DA3633"/>

                <View
                    android:layout_width="0dp"
                    android:layout_height="0dp"
                    android:layout_weight="1" />

                <TextView
                    android:id="@+id/btnSettings"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="⚙️"
                    android:textSize="22sp"
                    android:padding="8dp"
                    android:clickable="true"
                    android:focusable="true"/>

            </LinearLayout>

            <WebView
                android:id="@+id/webView"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:layout_below="@id/topBar"
                android:visibility="gone" />

            <LinearLayout
                android:id="@+id/offView"
                android:layout_width="match_parent"
                android:layout_height="match_parent"
                android:layout_below="@id/topBar"
                android:background="#0D1117"
                android:gravity="center"
                android:orientation="vertical"
                android:visibility="visible">

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="PORTALAPP IS OFF"
                    android:textColor="#8B949E"
                    android:textSize="16sp"
                    android:textStyle="bold"/>

                <TextView
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="Tekan tombol ON untuk memulai"
                    android:textColor="#484F58"
                    android:textSize="12sp"
                    android:layout_marginTop="4dp"/>
            </LinearLayout>

        </RelativeLayout>
        EOF

        # 8. Logika Utama MainActivity.java
        cat << 'EOF' > app/src/main/java/com/portalapp/games/MainActivity.java
        package com.portalapp.games;

        import android.app.AlertDialog;
        import android.os.Bundle;
        import android.view.View;
        import android.webkit.WebSettings;
        import android.webkit.WebView;
        import android.webkit.WebViewClient;
        import android.widget.Button;
        import android.widget.LinearLayout;
        import android.widget.SeekBar;
        import android.widget.Switch;
        import android.widget.TextView;
        import android.widget.ToggleButton;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {

            private WebView webView;
            private ToggleButton btnTogglePower;
            private TextView btnSettings;
            private LinearLayout offView;

            // Default State: OFF saat dibuka
            private boolean isPowerOn = false;
            private boolean isAdTurboActive = true;
            private boolean isSpeedHackActive = true;
            private boolean isCenterClickActive = true;
            private boolean isAutoSkipActive = true;
            private float speedMultiplier = 2.0f;

            private boolean isScriptInjected = false;
            private final String TARGET_URL = "http://App.portalapp.games";

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                setContentView(R.layout.activity_main);

                webView = findViewById(R.id.webView);
                btnTogglePower = findViewById(R.id.btnTogglePower);
                btnSettings = findViewById(R.id.btnSettings);
                offView = findViewById(R.id.offView);

                setupWebView();

                // Tombol POWER ON/OFF
                btnTogglePower.setOnCheckedChangeListener((buttonView, isChecked) -> {
                    isPowerOn = isChecked;
                    if (isChecked) {
                        btnTogglePower.setBackgroundTintList(android.content.res.ColorStateList.valueOf(0xFF238636));
                        offView.setVisibility(View.GONE);
                        webView.setVisibility(View.VISIBLE);
                        if (webView.getUrl() == null) {
                            webView.loadUrl(TARGET_URL);
                        }
                    } else {
                        btnTogglePower.setBackgroundTintList(android.content.res.ColorStateList.valueOf(0xFFDA3633));
                        webView.setVisibility(View.GONE);
                        offView.setVisibility(View.VISIBLE);
                    }
                });

                btnSettings.setOnClickListener(v -> showFullSettingsModal());
            }

            private void setupWebView() {
                WebSettings settings = webView.getSettings();
                settings.setJavaScriptEnabled(true);
                settings.setDomStorageEnabled(true);
                settings.setDatabaseEnabled(true);
                settings.setCacheMode(WebSettings.LOAD_DEFAULT);
                settings.setRenderPriority(WebSettings.RenderPriority.HIGH);
                settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                webView.setWebViewClient(new WebViewClient() {
                    @Override
                    public void onPageFinished(WebView view, String url) {
                        super.onPageFinished(view, url);
                        // Cegah Relog / Reload Loop dengan mengecek state
                        if (isPowerOn && !isScriptInjected) {
                            injectAdTurboExtensionEngine();
                            isScriptInjected = true;
                        }
                    }
                });
            }

            private void injectAdTurboExtensionEngine() {
                StringBuilder js = new StringBuilder("javascript:(function() {");
                js.append("if(window.adTurboInjected) return; window.adTurboInjected = true;");

                if (isAdTurboActive) {
                    js.append("const selectors = ['[id*=\"google_ads\"]', '[class*=\"ad-container\"]', 'iframe[src*=\"ads\"]', '.ad-banner'];");
                    js.append("selectors.forEach(s => document.querySelectorAll(s).forEach(el => el.remove()));");
                }

                if (isSpeedHackActive) {
                    js.append("window.HTMLMediaElement.prototype.play = (function(orig){");
                    js.append("  return function(){ this.playbackRate = ").append(speedMultiplier).append("; return orig.apply(this, arguments); };");
                    js.append("})(window.HTMLMediaElement.prototype.play);");
                }

                if (isCenterClickActive) {
                    js.append("document.addEventListener('click', function(e){ console.log('CenterClick active'); }, true);");
                }

                if (isAutoSkipActive) {
                    js.append("setInterval(function(){ const skip = document.querySelector('.ytp-ad-skip-button, .skip-ad'); if(skip) skip.click(); }, 1000);");
                }

                js.append("})();");

                webView.evaluateJavascript(js.toString(), null);
            }

            private void showFullSettingsModal() {
                AlertDialog.Builder builder = new AlertDialog.Builder(this);
                builder.setTitle("⚙️ AdTurbo v4.2.3 Settings");

                LinearLayout layout = new LinearLayout(this);
                layout.setOrientation(LinearLayout.VERTICAL);
                layout.setPadding(40, 30, 40, 30);

                Switch swAdTurbo = new Switch(this);
                swAdTurbo.setText("AdBlocker / Remove Ads");
                swAdTurbo.setChecked(isAdTurboActive);
                swAdTurbo.setPadding(0, 10, 0, 10);

                Switch swSpeed = new Switch(this);
                swSpeed.setText("SpeedHack Accelerator");
                swSpeed.setChecked(isSpeedHackActive);
                swSpeed.setPadding(0, 10, 0, 10);

                TextView tvSpeed = new TextView(this);
                tvSpeed.setText("Speed Multiplier: " + speedMultiplier + "x");
                tvSpeed.setPadding(0, 10, 0, 0);

                SeekBar sbSpeed = new SeekBar(this);
                sbSpeed.setMax(40);
                sbSpeed.setProgress((int) ((speedMultiplier - 1.0f) * 10));

                Switch swCenter = new Switch(this);
                swCenter.setText("CenterClick Auto-Bypass");
                swCenter.setChecked(isCenterClickActive);
                swCenter.setPadding(0, 10, 0, 10);

                Switch swSkip = new Switch(this);
                swSkip.setText("Auto Skip Ads");
                swSkip.setChecked(isAutoSkipActive);
                swSkip.setPadding(0, 10, 0, 20);

                Button btnReload = new Button(this);
                btnReload.setText("🔄 RELOAD PAGE");

                layout.addView(swAdTurbo);
                layout.addView(swSpeed);
                layout.addView(tvSpeed);
                layout.addView(sbSpeed);
                layout.addView(swCenter);
                layout.addView(swSkip);
                layout.addView(btnReload);

                builder.setView(layout);
                AlertDialog dialog = builder.create();

                sbSpeed.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                    @Override
                    public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                        speedMultiplier = 1.0f + (progress / 10.0f);
                        tvSpeed.setText("Speed Multiplier: " + String.format("%.1f", speedMultiplier) + "x");
                    }
                    @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                    @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                });

                swAdTurbo.setOnCheckedChangeListener((bv, checked) -> isAdTurboActive = checked);
                swSpeed.setOnCheckedChangeListener((bv, checked) -> isSpeedHackActive = checked);
                swCenter.setOnCheckedChangeListener((bv, checked) -> isCenterClickActive = checked);
                swSkip.setOnCheckedChangeListener((bv, checked) -> isAutoSkipActive = checked);

                btnReload.setOnClickListener(v -> {
                    isScriptInjected = false;
                    if (isPowerOn) webView.reload();
                    dialog.dismiss();
                });

                dialog.show();
            }

            @Override
            public void onBackPressed() {
                if (isPowerOn && webView.canGoBack()) {
                    webView.goBack();
                } else {
                    super.onBackPressed();
                }
            }
        }
        EOF

    - name: Build Android APK
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.1.1'
        arguments: assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PortalApp-release
        path: app/build/outputs/apk/debug/app-debug.apk
